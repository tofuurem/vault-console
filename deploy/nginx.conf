pid /tmp/vault-console/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/vault-console/client-temp;
    proxy_temp_path /tmp/vault-console/proxy-temp;
    fastcgi_temp_path /tmp/vault-console/fastcgi-temp;
    uwsgi_temp_path /tmp/vault-console/uwsgi-temp;
    scgi_temp_path /tmp/vault-console/scgi-temp;

    include /tmp/vault-console/server.conf;
}
